<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Room Form')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('rooms')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0" th:text="${room.id == null ? 'Add New Room' : 'Edit Room'}">Room Form</h5>
            <small class="text-muted">Fill in room details</small>
        </div>
        <a th:href="@{/rooms}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Rooms</a>
    </div>

    <div class="table-card p-4" style="max-width: 600px;">
        <form th:action="@{/rooms/save}" th:object="${room}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Room Number</label>
                <input type="text" th:field="*{roomNumber}" class="form-control" placeholder="e.g. 101" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Room Type</label>
                    <select th:field="*{roomType}" class="form-select" required>
                        <option th:each="t : ${roomTypes}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select th:field="*{status}" class="form-select" required>
                        <option th:each="s : ${roomStatuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Price / Night ($)</label>
                    <input type="number" step="0.01" th:field="*{pricePerNight}" class="form-control" placeholder="100.00" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Capacity (Guests)</label>
                    <input type="number" th:field="*{capacity}" class="form-control" min="1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Room details, view, amenities..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary fw-semibold"><i class="bi bi-check-circle me-1"></i>Save Room</button>
                <a th:href="@{/rooms}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
