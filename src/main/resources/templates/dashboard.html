<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0">Dashboard</h5>
            <small class="text-muted">Hotel overview &amp; statistics</small>
        </div>
        <div class="text-end">
            <div class="fw-semibold"><i class="bi bi-person-circle me-1"></i>Administrator</div>
            <small class="text-muted">admin</small>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Stats Row 1 -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="text-muted small fw-semibold">TOTAL ROOMS</div>
                        <div class="h3 fw-bold mb-0" th:text="${totalRooms}">0</div>
                    </div>
                    <div class="stat-icon ic-blue"><i class="bi bi-door-closed"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="text-muted small fw-semibold">AVAILABLE</div>
                        <div class="h3 fw-bold mb-0 text-success" th:text="${availableRooms}">0</div>
                    </div>
                    <div class="stat-icon ic-green"><i class="bi bi-check-circle"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="text-muted small fw-semibold">OCCUPIED</div>
                        <div class="h3 fw-bold mb-0 text-danger" th:text="${occupiedRooms}">0</div>
                    </div>
                    <div class="stat-icon ic-red"><i class="bi bi-person-fill"></i></div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="text-muted small fw-semibold">REVENUE</div>
                        <div class="h3 fw-bold mb-0 text-primary">
                            $<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0.00</span>
                        </div>
                    </div>
                    <div class="stat-icon ic-purple"><i class="bi bi-cash-stack"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Row 2 -->
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="stat-icon ic-blue"><i class="bi bi-people"></i></div>
                <div><div class="text-muted small">Total Customers</div><div class="h4 fw-bold mb-0" th:text="${totalCustomers}">0</div></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="stat-icon ic-green"><i class="bi bi-bookmark-check"></i></div>
                <div><div class="text-muted small">Active Reservations</div><div class="h4 fw-bold mb-0" th:text="${activeReservations}">0</div></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card d-flex align-items-center gap-3">
                <div class="stat-icon ic-amber"><i class="bi bi-calendar3"></i></div>
                <div><div class="text-muted small">Total Reservations</div><div class="h4 fw-bold mb-0" th:text="${totalReservations}">0</div></div>
            </div>
        </div>
    </div>

    <!-- Recent Reservations -->
    <div class="table-card">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <h6 class="fw-bold mb-0">Recent Reservations</h6>
            <a th:href="@{/reservations}" class="btn btn-sm btn-outline-primary">View All</a>
        </div>
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                    <tr><th>#</th><th>Customer</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(recentReservations)}">
                        <td colspan="7" class="text-center text-muted py-3">No reservations yet. <a th:href="@{/reservations/new}">Create one</a>.</td>
                    </tr>
                    <tr th:each="r : ${recentReservations}">
                        <td><strong th:text="'#' + ${r.id}"></strong></td>
                        <td th:text="${r.customer.name}">-</td>
                        <td>
                            Room <span th:text="${r.room.roomNumber}"></span>
                            <span class="badge bg-secondary" th:text="${r.room.roomType}"></span>
                        </td>
                        <td th:text="${r.checkInDate}">-</td>
                        <td th:text="${r.checkOutDate}">-</td>
                        <td><strong>$<span th:text="${#numbers.formatDecimal(r.totalAmount,1,2)}"></span></strong></td>
                        <td>
                            <span class="status-badge" th:classappend="'badge-' + ${r.status}" th:text="${r.status}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
