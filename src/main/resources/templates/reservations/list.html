<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservations')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('reservations')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0">Reservations</h5>
            <small class="text-muted">Manage check-in, check-out, and bookings</small>
        </div>
        <a th:href="@{/reservations/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Booking</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Status filter -->
    <div class="table-card p-3 mb-3">
        <form th:action="@{/reservations}" method="get" class="d-flex align-items-center gap-2" style="max-width: 350px;">
            <select name="status" class="form-select" onchange="this.form.submit()">
                <option value="">All Statuses</option>
                <option th:each="st : ${statuses}"
                        th:value="${st}"
                        th:text="${st}"
                        th:selected="${st.name() == selectedStatus}"></option>
            </select>
        </form>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                    <tr><th>#</th><th>Customer</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Guests</th><th>Nights</th><th>Amount</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reservations)}">
                        <td colspan="10" class="text-center text-muted py-3">No reservations found. <a th:href="@{/reservations/new}">Create one</a>.</td>
                    </tr>
                    <tr th:each="r : ${reservations}">
                        <td><strong th:text="'#' + ${r.id}"></strong></td>
                        <td th:text="${r.customer.name}">-</td>
                        <td>
                            Room <span th:text="${r.room.roomNumber}"></span>
                            <small class="text-muted" th:text="'(' + ${r.room.roomType} + ')'"></small>
                        </td>
                        <td th:text="${r.checkInDate}">-</td>
                        <td th:text="${r.checkOutDate}">-</td>
                        <td th:text="${r.numberOfGuests}">-</td>
                        <td th:text="${r.nights}">-</td>
                        <td><strong>$<span th:text="${#numbers.formatDecimal(r.totalAmount, 1, 2)}"></span></strong></td>
                        <td>
                            <span class="status-badge" th:classappend="'badge-' + ${r.status}" th:text="${r.status}"></span>
                        </td>
                        <td>
                            <span th:if="${r.status.name() == 'CONFIRMED'}">
                                <a th:href="@{/reservations/checkin/{id}(id=${r.id})}" class="btn btn-sm btn-success me-1">
                                    <i class="bi bi-box-arrow-in-right"></i> Check-In
                                </a>
                                <a th:href="@{/reservations/cancel/{id}(id=${r.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Cancel this reservation?')">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                            </span>
                            <span th:if="${r.status.name() == 'CHECKED_IN'}">
                                <a th:href="@{/reservations/checkout/{id}(id=${r.id})}" class="btn btn-sm btn-primary">
                                    <i class="bi bi-box-arrow-right"></i> Check-Out
                                </a>
                            </span>
                            <span th:if="${r.status.name() == 'CHECKED_OUT' or r.status.name() == 'CANCELLED'}">
                                <a th:href="@{/reservations/delete/{id}(id=${r.id})}" class="btn btn-sm btn-outline-secondary"
                                   onclick="return confirm('Delete this reservation history record?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
