<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Booking')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('booking')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0">New Reservation</h5>
            <small class="text-muted">Create room booking for a customer</small>
        </div>
        <a th:href="@{/reservations}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Reservations</a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" style="max-width: 650px;">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-card p-4" style="max-width: 650px;">
        <form th:action="@{/reservations/save}" th:object="${reservation}" method="post">
            <input type="hidden" th:field="*{id}">

            <h6 class="fw-bold text-primary mb-3 border-bottom pb-2">1. Select Guest</h6>
            <div class="mb-4">
                <label class="form-label fw-semibold">Customer</label>
                <select th:field="*{customer.id}" class="form-select" required>
                    <option value="">-- Select Customer --</option>
                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' (' + c.phone + ')'}"></option>
                </select>
                <div class="form-text">Don't see customer? <a th:href="@{/customers/new}">Add new customer first</a></div>
            </div>

            <h6 class="fw-bold text-primary mb-3 border-bottom pb-2">2. Room & Stay Details</h6>
            <div class="mb-3">
                <label class="form-label fw-semibold">Select Room</label>
                <select th:field="*{room.id}" class="form-select" required>
                    <option value="">-- Select Room --</option>
                    <option th:each="r : ${rooms}"
                            th:value="${r.id}"
                            th:text="'Room #' + ${r.roomNumber} + ' – ' + ${r.roomType} + ' ($' + ${r.pricePerNight} + '/night, max ' + ${r.capacity} + ' guests)'"></option>
                </select>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Check-In Date</label>
                    <input type="date" th:field="*{checkInDate}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Check-Out Date</label>
                    <input type="date" th:field="*{checkOutDate}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Number of Guests</label>
                    <input type="number" th:field="*{numberOfGuests}" class="form-control" min="1" value="1" required>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success fw-semibold"><i class="bi bi-check-circle me-1"></i>Confirm Booking</button>
                <a th:href="@{/reservations}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
