<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer Form')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('customers')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0" th:text="${customer.id == null ? 'Add New Customer' : 'Edit Customer'}">Customer Form</h5>
            <small class="text-muted">Enter guest information</small>
        </div>
        <a th:href="@{/customers}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Customers</a>
    </div>

    <div class="table-card p-4" style="max-width: 600px;">
        <form th:action="@{/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="555-0199" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">ID Proof (Passport / Driver's License / ID)</label>
                <input type="text" th:field="*{idProof}" class="form-control" placeholder="e.g. PASSPORT-A123456" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('idProof')}" th:errors="*{idProof}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Address</label>
                <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Street, City, Country..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary fw-semibold"><i class="bi bi-check-circle me-1"></i>Save Customer</button>
                <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
