<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rooms')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('rooms')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 class="fw-bold mb-0">Room Management</h5>
            <small class="text-muted">Add, edit, and manage hotel rooms</small>
        </div>
        <a th:href="@{/rooms/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Room</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                    <tr><th>Room #</th><th>Type</th><th>Price/Night</th><th>Capacity</th><th>Status</th><th>Description</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(rooms)}">
                        <td colspan="7" class="text-center text-muted py-3">No rooms found. <a th:href="@{/rooms/new}">Add one</a>.</td>
                    </tr>
                    <tr th:each="room : ${rooms}">
                        <td><strong th:text="${room.roomNumber}">-</strong></td>
                        <td th:text="${room.roomType}">-</td>
                        <td>$<span th:text="${room.pricePerNight}"></span>/night</td>
                        <td th:text="${room.capacity} + ' guests'">-</td>
                        <td>
                            <span class="status-badge" th:classappend="'badge-' + ${room.status}" th:text="${room.status}"></span>
                        </td>
                        <td class="text-muted small" th:text="${room.description ?: '-'}">-</td>
                        <td>
                            <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/rooms/delete/{id}(id=${room.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this room?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
